name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger from GitHub UI

concurrency:
  group: production-deploy
  cancel-in-progress: false  # don't cancel a running deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script on server
        run: |
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            'bash /var/www/dominio/deploy/scripts/deploy.sh'

      - name: Notify success
        if: success()
        run: echo "Deployed commit ${{ github.sha }} to dominiopr.com"
