{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINIO — Iniciar sesión</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preload" href="{% static 'landing/fonts/space-grotesk-latin-var.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'landing/css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'landing/css/dashboard.css' %}">
    <link rel="icon" href="{% static 'landing/images/brand/favicon-32.png' %}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'landing/images/brand/apple-touch-icon.png' %}">
</head>
<body class="dash-login-body">
    <div class="dash-login-card">
        <img src="{% static 'landing/images/brand/logo-wordmark.png' %}" alt="DOMINIO">
        <h1>Dashboard de Leads</h1>
        <p>Inicia sesión para administrar tus leads</p>
        {% if form.errors %}
        <div class="dash-login-error">Usuario o contraseña incorrectos. Intenta de nuevo.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" aria-label="Usuario" placeholder="Usuario" autocomplete="username" required autofocus>
            <input type="password" name="password" aria-label="Contraseña" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="submit">Iniciar sesión</button>
        </form>
        <p style="margin:18px 0 0;"><a href="{% url 'password_reset' %}" style="color:var(--muted);font-size:.85rem;">¿Olvidaste tu contraseña?</a></p>
    </div>
</body>
</html>
