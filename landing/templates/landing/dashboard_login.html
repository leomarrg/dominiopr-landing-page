{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINIO — Iniciar sesión</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'landing/css/dashboard.css' %}">
    <link rel="icon" type="image/png" href="{% static 'landing/images/logo/profile_pic@4x.PNG' %}">
</head>
<body class="dash-login-body">
    <div class="dash-login-card">
        <img src="{% static 'landing/images/logo/logo_home.PNG' %}" alt="DOMINIO">
        <h1>Dashboard de Leads</h1>
        <p>Inicia sesión para administrar tus leads</p>
        {% if form.errors %}
        <div class="dash-login-error">Usuario o contraseña incorrectos. Intenta de nuevo.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Usuario" autocomplete="username" required autofocus>
            <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="submit">Iniciar sesión</button>
        </form>
    </div>
</body>
</html>
