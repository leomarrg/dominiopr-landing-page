{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINIO — Restablecer contraseña</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preload" href="{% static 'landing/fonts/space-grotesk-latin-var.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'landing/css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'landing/css/dashboard.css' %}">
    <link rel="icon" href="{% static 'landing/images/brand/favicon-32.png' %}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'landing/images/brand/apple-touch-icon.png' %}">
</head>
<body class="dash-login-body">
    <div class="dash-login-card">
        <img src="{% static 'landing/images/brand/logo-wordmark.png' %}" alt="DOMINIO">
        <h1>Restablecer contraseña</h1>
        <p>Escribe tu correo y te enviamos un enlace para elegir una nueva contraseña.</p>
        {% if form.errors %}
        <div class="dash-login-error">Escribe un correo válido e intenta de nuevo.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" aria-label="Tu correo" placeholder="Tu correo" autocomplete="email" required autofocus>
            <button type="submit">Enviarme el enlace</button>
        </form>
        <p style="margin:18px 0 0;"><a href="{% url 'login' %}" style="color:var(--muted);font-size:.85rem;">&larr; Volver a iniciar sesión</a></p>
    </div>
</body>
</html>
