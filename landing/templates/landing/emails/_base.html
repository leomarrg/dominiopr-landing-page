<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>DOMINIO</title>
</head>
<body style="margin:0; padding:0; background:#0b0d12; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0b0d12;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px; max-width:100%; background:#15171f; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,0.08);">

          <!-- Header -->
          <tr>
            <td style="padding:28px 36px; background:#11131a; border-bottom:2px solid #3bc0c7;">
              <span style="font-family:'Helvetica Neue',Arial,sans-serif; color:#ffffff; font-size:22px; font-weight:700; letter-spacing:3px;">{{ business|default:"DOMINIO"|upper }}</span>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:36px; font-family:'Helvetica Neue',Arial,sans-serif; color:rgba(255,255,255,0.82); font-size:15px; line-height:1.7;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:22px 36px; background:#0e1016; border-top:1px solid rgba(255,255,255,0.06);">
              <p style="margin:0; font-family:'Helvetica Neue',Arial,sans-serif; color:rgba(255,255,255,0.4); font-size:12px; line-height:1.6;">
                {% if business and business != "DOMINIO" %}{{ business }}<br>
                <a href="https://dominiopr.com" style="color:#3bc0c7; text-decoration:none;">Desarrollado por DOMINIO</a>{% else %}DOMINIO &middot; Estudio de Desarrollo de Software &middot; Puerto Rico<br>
                <a href="https://dominiopr.com" style="color:#3bc0c7; text-decoration:none;">dominiopr.com</a>{% endif %}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
