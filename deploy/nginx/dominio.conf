# /etc/nginx/sites-available/dominio.conf
# After uploading: sudo ln -s /etc/nginx/sites-available/dominio.conf /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

# --- Redirect HTTP to HTTPS for the landing ---
server {
    listen 80;
    listen [::]:80;
    server_name dominiopr.com www.dominiopr.com;
    return 301 https://$host$request_uri;
}

# --- Main landing on dominiopr.com + www ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dominiopr.com www.dominiopr.com;

    # SSL certs managed by certbot (Let's Encrypt). Paths filled in after running certbot.
    ssl_certificate     /etc/letsencrypt/live/dominiopr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominiopr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10M;

    # Static files served directly by Nginx (faster than WhiteNoise even)
    # WhiteNoise is the fallback if Nginx doesn't catch them.
    location /static/ {
        alias /var/www/dominio/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Everything else -> Gunicorn via unix socket
    location / {
        proxy_pass http://unix:/run/gunicorn-dominio/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

