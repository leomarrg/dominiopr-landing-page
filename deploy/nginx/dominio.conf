# /etc/nginx/sites-available/dominio.conf
# After uploading: sudo ln -s /etc/nginx/sites-available/dominio.conf /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

# --- Redirect HTTP to HTTPS for the landing ---
server {
    listen 80;
    listen [::]:80;
    server_name dominiopr.com www.dominiopr.com;
    return 301 https://$host$request_uri;
}

# --- www -> apex, once, over HTTPS ---
# Both hostnames used to serve the same pages, which is duplicate content for
# search engines and splits any link equity between two URLs. The <link
# rel="canonical"> tag already points at the apex, but a canonical is a hint;
# a 301 is the actual rule. Redirecting here (not in Django) also means the
# request never reaches gunicorn.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dominiopr.com;

    ssl_certificate     /etc/letsencrypt/live/dominiopr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominiopr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://dominiopr.com$request_uri;
}

# --- Main landing on the apex domain ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dominiopr.com;

    # SSL certs managed by certbot (Let's Encrypt). Paths filled in after running certbot.
    ssl_certificate     /etc/letsencrypt/live/dominiopr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominiopr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 10M;

    # Compression for HTML/JSON/JS/CSS/SVG (static files under /static/ are
    # pre-compressed by WhiteNoise's collectstatic; this covers everything
    # Nginx serves itself + Gunicorn responses).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml font/woff2;

    # Static files served directly by Nginx (faster than WhiteNoise even)
    # WhiteNoise is the fallback if Nginx doesn't catch them.
    location /static/ {
        alias /var/www/dominio/staticfiles/;
        # Files are content-hashed by CompressedManifestStaticFilesStorage, so a
        # long immutable cache is correct (a new deploy = new file names).
        expires 1y;
        access_log off;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else -> Gunicorn via unix socket
    location / {
        proxy_pass http://unix:/run/gunicorn-dominio/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for APPENDS $remote_addr to whatever
        # X-Forwarded-For the client sent, so the trusted address is the LAST
        # value. landing.views._client_ip reads it that way; do not switch to
        # a first-value parser without changing this directive to $remote_addr.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

