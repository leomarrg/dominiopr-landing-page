# /etc/nginx/sites-available/dominio.conf
# After uploading: sudo ln -s /etc/nginx/sites-available/dominio.conf /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

# --- Redirect HTTP to HTTPS for the landing ---
server {
    listen 80;
    listen [::]:80;
    server_name dominiopr.com www.dominiopr.com;
    return 301 https://$host$request_uri;
}

# --- www -> apex, once, over HTTPS ---
# Both hostnames used to serve the same pages, which is duplicate content for
# search engines and splits any link equity between two URLs. The <link
# rel="canonical"> tag already points at the apex, but a canonical is a hint;
# a 301 is the actual rule. Redirecting here (not in Django) also means the
# request never reaches gunicorn.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dominiopr.com;

    ssl_certificate     /etc/letsencrypt/live/dominiopr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominiopr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://dominiopr.com$request_uri;
}

# --- Main landing on the apex domain ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dominiopr.com;

    # SSL certs managed by certbot (Let's Encrypt). Paths filled in after running certbot.
    ssl_certificate     /etc/letsencrypt/live/dominiopr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominiopr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # --- Abuse and exhaustion limits (zones in conf.d/dominio-limits.conf) ---
    # The instance has 512MB and gunicorn runs 2 workers: without these, a
    # handful of slow or repeated requests is enough to take the site down,
    # no attack required.
    limit_conn dominio_conn 20;                          # open connections per IP
    limit_req  zone=dominio_general burst=30 nodelay;    # default for every path
    # Nothing here accepts uploads; the largest legitimate body is a chat turn
    # of a few KB. Large bodies are a memory attack on the workers.
    client_max_body_size 256k;
    # Slowloris: a client that trickles headers/body keeps a connection (not a
    # worker) busy — bound how long we wait for it.
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     20s;

    # Proxy settings shared by every location below (proxy_pass itself must
    # sit inside a location).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for APPENDS $remote_addr to whatever
    # X-Forwarded-For the client sent, so the trusted address is the LAST
    # value. landing.views._client_ip reads it that way; do not switch to
    # a first-value parser without changing this directive to $remote_addr.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    # gunicorn --timeout is 60s; give nginx a little more so the worker, not
    # nginx, is the one that ends a stuck request (and logs why).
    proxy_read_timeout    65s;
    proxy_connect_timeout 5s;

    # Compression for HTML/JSON/JS/CSS/SVG (static files under /static/ are
    # pre-compressed by WhiteNoise's collectstatic; this covers everything
    # Nginx serves itself + Gunicorn responses).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/manifest+json image/svg+xml font/woff2;

    # Static files served directly by Nginx (faster than WhiteNoise even)
    # WhiteNoise is the fallback if Nginx doesn't catch them.
    location /static/ {
        alias /var/www/dominio/staticfiles/;
        # Files are content-hashed by CompressedManifestStaticFilesStorage, so a
        # long immutable cache is correct (a new deploy = new file names).
        expires 1y;
        access_log off;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Stripe delivers a checkout as a burst of ~10 events within a second, from
    # a handful of addresses. Exact-match location wins over the /api/ prefix
    # below, so webhooks get the general bucket, not the tight API one.
    location = /api/stripe/webhook/ {
        limit_req zone=dominio_general burst=30 nodelay;
        proxy_pass http://unix:/run/gunicorn-dominio/gunicorn.sock;
    }

    # Chat, demo, survey: each request holds a worker for an Anthropic round
    # trip (10-20s). This is the endpoint an attacker would pick.
    location ^~ /api/ {
        limit_req zone=dominio_api burst=10 nodelay;
        proxy_pass http://unix:/run/gunicorn-dominio/gunicorn.sock;
    }

    # Login, password reset, admin: brute-force surface. Django rate-limits
    # these too; this keeps the attempts from costing a worker each.
    location ~ ^/(dashboard/(login|password)/|admin/) {
        limit_req zone=dominio_auth burst=5 nodelay;
        proxy_pass http://unix:/run/gunicorn-dominio/gunicorn.sock;
    }

    # Everything else -> Gunicorn via unix socket
    location / {
        proxy_pass http://unix:/run/gunicorn-dominio/gunicorn.sock;
    }
}

