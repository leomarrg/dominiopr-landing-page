# /etc/nginx/conf.d/dominio-limits.conf
#
# Shared-memory zones for rate limiting. These MUST live in the http{} context,
# which is why they are a separate file under conf.d/ instead of inside the
# server block in dominio.conf (nginx refuses limit_req_zone there).
#
# Keyed on the real client address, not X-Forwarded-For, so a client cannot
# pick its own bucket. 10m of shared memory tracks ~160k addresses per zone.
#
# Rates are deliberately looser than the per-IP limits Django enforces
# (chat 12/min, signup 5/5min...). This layer is not the policy; it is the
# thing that keeps a flood from ever reaching the 2 gunicorn workers, where
# each request costs a Python process for its whole duration.

limit_req_zone  $binary_remote_addr zone=dominio_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=dominio_api:10m     rate=3r/s;
limit_req_zone  $binary_remote_addr zone=dominio_auth:10m    rate=1r/s;
limit_conn_zone $binary_remote_addr zone=dominio_conn:10m;

# 429 instead of nginx's default 503, so a browser (and our own monitoring)
# can tell "you are being throttled" from "the backend is down".
limit_req_status  429;
limit_conn_status 429;
